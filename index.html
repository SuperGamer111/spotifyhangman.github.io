<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Hangman</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #1DB954;
    --green-dim: rgba(29,185,84,0.15);
    --green-glow: rgba(29,185,84,0.3);
    --bg: #000;
    --surface: #0d0d0d;
    --border: #1a1a1a;
    --border-bright: #2a2a2a;
    --text: #f0f0f0;
    --muted: #555;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #app { width: 100%; max-width: 780px; padding: 40px 24px; }

  /* screens */
  .screen { animation: up 0.25s ease; }
  .hidden { display: none !important; }
  @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ── inputs ── */
  input {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus { border-color: var(--green); }
  input::placeholder { color: var(--muted); }

  /* ── buttons ── */
  .btn {
    background: var(--green);
    border: none;
    border-radius: 4px;
    color: #000;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 10px 22px;
    transition: opacity 0.15s, transform 0.15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    padding: 8px 16px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { border-color: var(--green); color: var(--text); }

  /* ═══════════════════════════
     WELCOME
  ═══════════════════════════ */
  #screen-welcome {
    text-align: center;
    padding: 60px 0;
  }
  #screen-welcome h1 {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 48px;
    line-height: 1;
  }
  #screen-welcome h1 span { color: var(--green); }
  .play-btn {
    background: var(--green);
    border: none;
    border-radius: 4px;
    color: #000;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 14px 52px;
    transition: opacity 0.15s, box-shadow 0.15s;
  }
  .play-btn:hover { opacity: 0.85; box-shadow: 0 0 30px var(--green-glow); }

  /* ── modal ── */
  .modal-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 6px;
    padding: 32px;
    width: 90%; max-width: 420px;
  }
  .modal h2 { font-size: 1rem; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; }

  /* ═══════════════════════════
     SETUP
  ═══════════════════════════ */
  #screen-setup { max-width: 400px; margin: 0 auto; padding: 20px 0; }
  #screen-setup h2 { font-size: 1rem; color: var(--muted); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 2px; }
  .name-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .dot.d2 { background: var(--text); opacity: 0.3; }
  #screen-setup .btn { margin-top: 10px; }

  /* ═══════════════════════════
     PICKER
  ═══════════════════════════ */
  #screen-picker { max-width: 600px; margin: 0 auto; }
  .picker-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
    color: var(--muted); margin-bottom: 6px;
  }
  .picker-name { font-size: 1.1rem; font-weight: 700; color: var(--green); margin-bottom: 24px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input { flex: 1; }
  .results { display: flex; flex-direction: column; gap: 6px; min-height: 48px; margin-bottom: 20px; }
  .track {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--border-bright);
    border-radius: 4px; padding: 10px 14px;
    cursor: pointer; transition: border-color 0.12s, background 0.12s;
  }
  .track:hover { border-color: var(--green); background: var(--green-dim); }
  .track.sel { border-color: var(--green); background: var(--green-dim); }
  .track img { width: 38px; height: 38px; border-radius: 3px; object-fit: cover; background: #111; flex-shrink: 0; }
  .track-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 0.72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-info { flex: 1; min-width: 0; }
  .track-check { color: var(--green); font-size: 1rem; visibility: hidden; flex-shrink: 0; }
  .track.sel .track-check { visibility: visible; }
  .status-line { font-size: 0.75rem; color: var(--muted); padding: 10px 0; }
  .confirm-row { display: flex; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--border); }

  /* ═══════════════════════════
     GAME
  ═══════════════════════════ */
  #screen-game { }

  .game-top {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto auto;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .score-block { flex: 1; }
  .score-pname { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .score-val { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .score-val.active { color: var(--green); }
  .score-sep { color: var(--border-bright); font-size: 0.85rem; padding: 0 16px; }
  .round-tag { font-size: 0.7rem; color: var(--muted); margin-left: auto; padding-right: 16px; text-transform: uppercase; letter-spacing: 1px; }

  .game-body { display: grid; grid-template-columns: 180px 1fr; gap: 16px; }

  /* hangman column */
  .hm-col {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  #hm-svg { width: 140px; height: 150px; }
  .hm-wrong { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .hm-letter {
    border: 1px solid var(--border-bright);
    border-radius: 3px; padding: 2px 7px;
    font-size: 0.75rem; color: var(--muted);
  }

  /* right column */
  .play-col { display: flex; flex-direction: column; gap: 16px; }

  .context-line { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .context-line span { color: var(--text); }

  /* word */
  .word-wrap {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 12px;
  }
  .word-rows { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .word-group { display: flex; gap: 6px; }
  .lbox { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .lchar {
    font-size: 1.35rem; font-weight: 700;
    width: 20px; text-align: center; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    transition: color 0.15s;
  }
  .lchar.show { color: var(--text); animation: pop 0.2s cubic-bezier(.34,1.56,.64,1); }
  .lchar.auto { color: var(--green); }
  @keyframes pop { from { transform: scale(0.4); } to { transform: scale(1); } }
  .lline { width: 20px; height: 1px; background: var(--border-bright); }
  .lline.on { background: var(--green); }

  /* keyboard */
  .kb { display: flex; flex-direction: column; gap: 5px; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 3px; padding: 7px 0;
    font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700;
    cursor: pointer; color: var(--text); min-width: 30px; text-align: center;
    transition: border-color 0.1s, background 0.1s, color 0.1s;
  }
  .key:hover:not([disabled]) { border-color: var(--green); color: var(--green); }
  .key.hit { background: var(--green-dim); border-color: var(--green); color: var(--green); cursor: default; }
  .key.miss { border-color: var(--border); color: var(--border-bright); cursor: default; opacity: 0.5; }

  /* result overlay */
  .result-bg {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
  }
  .result-box {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 6px; padding: 36px;
    max-width: 400px; width: 90%; text-align: center;
  }
  .result-box h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .result-box h2.win { color: var(--green); }
  .result-box .sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 20px; }
  .result-song { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
  .result-artist { font-size: 0.75rem; color: var(--muted); margin-bottom: 24px; }
  .result-actions { display: flex; gap: 10px; justify-content: center; }

  /* ═══════════════════════════
     SCOREBOARD
  ═══════════════════════════ */
  #screen-scores { max-width: 420px; margin: 0 auto; text-align: center; padding: 20px 0; }
  #screen-scores h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 32px; }
  .final-scores { display: flex; gap: 16px; margin-bottom: 32px; }
  .fscore {
    flex: 1; border: 1px solid var(--border-bright);
    border-radius: 4px; padding: 24px 16px;
  }
  .fscore.winner { border-color: var(--green); }
  .fscore .fn { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
  .fscore .fv { font-size: 3rem; font-weight: 700; line-height: 1; }
  .fscore.winner .fv { color: var(--green); }
  .history { text-align: left; margin-bottom: 28px; }
  .history h3 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .hist-row {
    display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border); padding: 8px 0;
    font-size: 0.78rem;
  }
  .hist-rnd { color: var(--muted); width: 40px; flex-shrink: 0; }
  .hist-song { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-out { flex-shrink: 0; }
  .hist-out.w { color: var(--green); }
  .hist-out.l { color: var(--muted); }

  @media (max-width: 580px) {
    .game-body { grid-template-columns: 1fr; }
    .hm-col { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    #hm-svg { width: 140px; height: 148px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="screen-welcome" class="screen">
    <h1>Spotify<br><span>Hangman</span></h1>
    <button class="play-btn" onclick="openModal()">PLAY</button>
  </div>

  <div class="modal-bg hidden" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>Spotify Client ID</h2>
      <div class="row">
        <input type="text" id="cid" placeholder="Paste Client ID…" onkeydown="if(event.key==='Enter')connect()">
        <button class="btn" onclick="connect()">Go</button>
      </div>
    </div>
  </div>

  <div id="screen-setup" class="screen hidden">
    <h2>Players</h2>
    <div class="name-row"><div class="dot"></div><input type="text" id="p1" value="Player 1" maxlength="18"></div>
    <div class="name-row"><div class="dot d2"></div><input type="text" id="p2" value="Player 2" maxlength="18"></div>
    <button class="btn" onclick="startGame()">Start</button>
  </div>

  <div id="screen-picker" class="screen hidden">
    <div class="picker-label">Picking a song</div>
    <div class="picker-name" id="picker-name"></div>
    <div class="search-row">
      <input type="text" id="search-q" placeholder="Search Spotify…" oninput="debouncedSearch(this.value)" onkeydown="if(event.key==='Enter')doSearch(this.value)">
      <button class="btn" onclick="doSearch(document.getElementById('search-q').value)">Search</button>
    </div>
    <div class="results" id="results"><div class="status-line">Start typing to search…</div></div>
    <div class="confirm-row">
      <button class="btn" id="confirm-btn" onclick="confirmSong()" disabled>Use this song →</button>
    </div>
  </div>

  <div id="screen-game" class="screen hidden">
    <div class="game-top">
      <div class="score-block">
        <div class="score-pname" id="s-p1-name"></div>
        <div class="score-val" id="s-p1-val">0</div>
      </div>
      <div class="score-sep">—</div>
      <div class="score-block" style="text-align:right">
        <div class="score-pname" id="s-p2-name"></div>
        <div class="score-val" id="s-p2-val">0</div>
      </div>
      <div class="round-tag" id="round-tag"></div>
      <button class="btn-ghost" onclick="endGame()">End</button>
    </div>

    <div class="game-body">
      <div class="hm-col">
        <svg id="hm-svg" viewBox="0 0 180 190" xmlns="http://www.w3.org/2000/svg">
          <line x1="10" y1="182" x2="170" y2="182" stroke="#222" stroke-width="3" stroke-linecap="round"/>
          <line x1="50" y1="182" x2="50" y2="10" stroke="#222" stroke-width="3" stroke-linecap="round"/>
          <line x1="50" y1="10" x2="115" y2="10" stroke="#222" stroke-width="3" stroke-linecap="round"/>
          <line x1="115" y1="10" x2="115" y2="32" stroke="#222" stroke-width="3" stroke-linecap="round"/>
          <circle id="p-head" cx="115" cy="47" r="14" fill="none" stroke="var(--green)" stroke-width="2.5" style="display:none"/>
          <line id="p-body" x1="115" y1="61" x2="115" y2="108" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" style="display:none"/>
          <line id="p-la" x1="115" y1="75" x2="93" y2="97" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" style="display:none"/>
          <line id="p-ra" x1="115" y1="75" x2="137" y2="97" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" style="display:none"/>
          <line id="p-ll" x1="115" y1="108" x2="93" y2="140" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" style="display:none"/>
          <line id="p-rl" x1="115" y1="108" x2="137" y2="140" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" style="display:none"/>
        </svg>
        <div class="hm-wrong" id="hm-wrong"></div>
      </div>

      <div class="play-col">
        <div class="context-line">Guessing: <span id="ctx-guesser"></span></div>
        <div class="word-wrap"><div class="word-rows" id="word-display"></div></div>
        <div class="kb" id="kb"></div>
      </div>
    </div>
  </div>

  <div id="screen-scores" class="screen hidden">
    <h2>Final Score</h2>
    <div class="final-scores">
      <div class="fscore" id="fs1"><div class="fn" id="fs1-name"></div><div class="fv" id="fs1-val"></div></div>
      <div class="fscore" id="fs2"><div class="fn" id="fs2-name"></div><div class="fv" id="fs2-val"></div></div>
    </div>
    <div class="history"><h3>Rounds</h3><div id="hist"></div></div>
    <button class="btn" onclick="newGame()">Play Again</button>
  </div>

</div>

<div class="result-bg hidden" id="result-bg">
  <div class="result-box">
    <h2 id="r-title"></h2>
    <div class="sub" id="r-sub"></div>
    <div class="result-song" id="r-song"></div>
    <div class="result-artist" id="r-artist"></div>
    <div class="result-actions">
      <button class="btn-ghost" onclick="endGame()">End Game</button>
      <button class="btn" onclick="nextRound()">Next Round →</button>
    </div>
  </div>
</div>

<script>
const G = {
  token: null,
  players: ['Player 1','Player 2'],
  scores: [0,0],
  round: 0,
  pickerIdx: 0,
  track: null,
  word: '',
  guessed: new Set(),
  wrong: [],
  maxWrong: 6,
  over: false,
  history: [],
};

const PARTS = ['p-head','p-body','p-la','p-ra','p-ll','p-rl'];

// ── screens ──────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ── modal ────────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('cid').focus(), 40);
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

// ── spotify oauth (pkce) ──────────────────────
function randStr(n) {
  const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b => c[b % c.length]).join('');
}
async function challenge(v) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function connect() {
  const id = document.getElementById('cid').value.trim();
  if (!id) return;
  const v = randStr(64);
  const ch = await challenge(v);
  sessionStorage.setItem('v', v);
  sessionStorage.setItem('id', id);
  const base = window.location.href.split('?')[0].split('#')[0];
  location.href = `https://accounts.spotify.com/authorize?response_type=code&client_id=${id}&scope=user-read-private&redirect_uri=${encodeURIComponent(base)}&code_challenge_method=S256&code_challenge=${ch}`;
}
async function handleCallback() {
  const p = new URLSearchParams(location.search);
  const code = p.get('code');
  if (!code) return false;
  const v = sessionStorage.getItem('v');
  const id = sessionStorage.getItem('id');
  if (!v || !id) return false;
  const base = location.href.split('?')[0].split('#')[0];
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:base,client_id:id,code_verifier:v})
  });
  const data = await res.json();
  if (data.access_token) {
    G.token = data.access_token;
    history.replaceState({}, '', location.pathname);
    return true;
  }
  return false;
}

// ── setup ─────────────────────────────────────
function startGame() {
  G.players[0] = document.getElementById('p1').value.trim() || 'Player 1';
  G.players[1] = document.getElementById('p2').value.trim() || 'Player 2';
  G.scores = [0,0];
  G.round = 0;
  G.pickerIdx = 0;
  G.history = [];
  startPicking();
}

// ── picker ────────────────────────────────────
function startPicking() {
  G.track = null;
  document.getElementById('confirm-btn').disabled = true;
  document.getElementById('search-q').value = '';
  document.getElementById('results').innerHTML = '<div class="status-line">Start typing to search…</div>';
  document.getElementById('picker-name').textContent = G.players[G.pickerIdx];
  show('screen-picker');
}

let searchTimer = null;
function debouncedSearch(q) {
  clearTimeout(searchTimer);
  if (q.length < 2) return;
  searchTimer = setTimeout(() => doSearch(q), 380);
}
async function doSearch(q) {
  if (!q || q.length < 2) return;
  const el = document.getElementById('results');
  el.innerHTML = '<div class="status-line">Searching…</div>';
  try {
    const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=7`, {
      headers: {Authorization: `Bearer ${G.token}`}
    });
    const data = await res.json();
    if (data.error) { el.innerHTML = `<div class="status-line">${data.error.message}</div>`; return; }
    const tracks = data.tracks?.items || [];
    if (!tracks.length) { el.innerHTML = '<div class="status-line">No results.</div>'; return; }
    el.innerHTML = '';
    tracks.forEach(t => {
      const div = document.createElement('div');
      div.className = 'track';
      const img = t.album?.images?.[2]?.url || t.album?.images?.[0]?.url || '';
      div.innerHTML = `
        <img src="${img}" alt="" onerror="this.style.display='none'">
        <div class="track-info">
          <div class="track-name">${esc(t.name)}</div>
          <div class="track-artist">${esc(t.artists.map(a=>a.name).join(', '))}</div>
        </div>
        <div class="track-check">✓</div>`;
      div.onclick = () => selectTrack(t);
      el.appendChild(div);
    });
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="status-line">Search failed.</div>';
  }
}
function selectTrack(t) {
  G.track = t;
  document.querySelectorAll('.track').forEach(el => el.classList.remove('sel'));
  // find and select
  document.querySelectorAll('.track').forEach(el => {
    if (el.querySelector('.track-name').textContent === t.name) el.classList.add('sel');
  });
  document.getElementById('confirm-btn').disabled = false;
}
function confirmSong() {
  if (!G.track) return;
  beginRound(G.track);
}

// ── game round ────────────────────────────────
function beginRound(track) {
  G.round++;
  G.over = false;
  G.guessed = new Set();
  G.wrong = [];
  const cleanTitle = cleanTrackTitle(track.name);
  G.word = cleanTitle.toLowerCase();

  // auto-reveal non-alpha
  for (const ch of G.word) if (!/[a-z]/.test(ch)) G.guessed.add(ch);

  const gi = 1 - G.pickerIdx;

  // scores bar
  document.getElementById('s-p1-name').textContent = G.players[0];
  document.getElementById('s-p2-name').textContent = G.players[1];
  document.getElementById('s-p1-val').textContent = G.scores[0];
  document.getElementById('s-p2-val').textContent = G.scores[1];
  document.getElementById('s-p1-val').className = 'score-val' + (gi===0?' active':'');
  document.getElementById('s-p2-val').className = 'score-val' + (gi===1?' active':'');
  document.getElementById('round-tag').textContent = `Round ${G.round}`;
  document.getElementById('ctx-guesser').textContent = G.players[gi];

  // reset hangman
  PARTS.forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('hm-wrong').innerHTML = '';

  renderWord();
  buildKeyboard();
  show('screen-game');
}

function renderWord() {
  const words = G.word.split(' ');
  const wrap = document.getElementById('word-display');
  wrap.innerHTML = '';
  words.forEach((word, wi) => {
    if (wi > 0) {
      const sp = document.createElement('div');
      sp.style.width = '14px';
      wrap.appendChild(sp);
    }
    const grp = document.createElement('div');
    grp.className = 'word-group';
    for (const ch of word) {
      const revealed = G.guessed.has(ch);
      const box = document.createElement('div');
      box.className = 'lbox';
      const lc = document.createElement('div');
      lc.className = 'lchar' + (revealed ? (!/[a-z]/.test(ch) ? ' auto' : ' show') : '');
      lc.textContent = revealed ? ch.toUpperCase() : '';
      const ll = document.createElement('div');
      ll.className = 'lline' + (revealed ? ' on' : '');
      box.appendChild(lc);
      box.appendChild(ll);
      grp.appendChild(box);
    }
    wrap.appendChild(grp);
  });
}

function buildKeyboard() {
  const kb = document.getElementById('kb');
  kb.innerHTML = '';
  ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    for (const letter of row) {
      const k = document.createElement('button');
      k.className = 'key';
      k.textContent = letter;
      k.dataset.l = letter.toLowerCase();
      k.onclick = () => guess(letter.toLowerCase());
      div.appendChild(k);
    }
    kb.appendChild(div);
  });
}

function guess(letter) {
  if (G.over || G.guessed.has(letter)) return;
  G.guessed.add(letter);
  const hit = G.word.includes(letter);
  const key = document.querySelector(`.key[data-l="${letter}"]`);
  if (key) { key.classList.add(hit ? 'hit' : 'miss'); key.disabled = true; }
  if (!hit) {
    G.wrong.push(letter);
    const p = document.getElementById(PARTS[G.wrong.length - 1]);
    if (p) p.style.display = '';
    const span = document.createElement('div');
    span.className = 'hm-letter';
    span.textContent = letter.toUpperCase();
    document.getElementById('hm-wrong').appendChild(span);
  }
  renderWord();
  checkEnd();
}

function checkEnd() {
  const solved = [...G.word].every(ch => G.guessed.has(ch) || !/[a-z]/.test(ch));
  const dead = G.wrong.length >= G.maxWrong;
  if (!solved && !dead) return;
  G.over = true;
  const gi = 1 - G.pickerIdx;
  const won = solved && !dead;
  if (won) G.scores[gi] += 2; else G.scores[G.pickerIdx] += 1;
  G.history.push({ round: G.round, name: G.track.name, artist: G.track.artists.map(a=>a.name).join(', '), won });

  const title = document.getElementById('r-title');
  title.textContent = won ? `${G.players[gi]} got it!` : `${G.players[G.pickerIdx]} wins the round`;
  title.className = won ? 'win' : '';
  document.getElementById('r-sub').textContent = won ? `+2 pts for ${G.players[gi]}` : `+1 pt for ${G.players[G.pickerIdx]}`;
  document.getElementById('r-song').textContent = cleanTrackTitle(G.track.name);
  document.getElementById('r-artist').textContent = G.track.artists.map(a=>a.name).join(', ');
  document.getElementById('result-bg').classList.remove('hidden');
}

function nextRound() {
  document.getElementById('result-bg').classList.add('hidden');
  G.pickerIdx = 1 - G.pickerIdx;
  startPicking();
}

// ── keyboard shortcut ─────────────────────────
document.addEventListener('keydown', e => {
  if (document.getElementById('screen-game').classList.contains('hidden')) return;
  if (G.over) return;
  if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey) guess(e.key.toLowerCase());
});

function cleanTrackTitle(title) {
  return title
    .replace(/\s*\(feat\.[^)]+\)/gi, '')
    .replace(/\s*\(featuring[^)]+\)/gi, '')
    .replace(/\s*\(with[^)]+\)/gi, '')
    .replace(/\s*\[feat\.[^\]]+\]/gi, '')
    .replace(/\s*\[with[^\]]+\]/gi, '')
    .trim();
}

function esc(s) { return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }

// ── init ─────────────────────────────────────
(async () => {
  if (location.search.includes('code=')) {
    const ok = await handleCallback();
    if (ok) { show('screen-setup'); return; }
  }
  if (location.search.includes('error=')) history.replaceState({}, '', location.pathname);
  show('screen-welcome');
})();
</script>
